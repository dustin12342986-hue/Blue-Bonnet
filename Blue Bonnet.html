<style>
  :root {
    --bg: #12151A;
    --panel: #171B22;
    --panel2: #1D222B;
    --border: #2A3038;
    --text: #E8EAED;
    --muted: #8A93A3;
    --dim: #5C6472;
    --accent: #4A9EFF;
    --gold: #C9A15C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .03em; }
  header p { font-size: 11px; margin: 2px 0 0; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  #chatBody { flex: 1; overflow-y: auto; padding: 18px; max-width: 720px; width: 100%; margin: 0 auto; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; text-align: center; padding: 0 24px; }
  .empty img.hero { width: min(280px, 70vw); height: min(280px, 70vw); border-radius: 20px; margin-bottom: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.5); object-fit: cover; }
  .empty h2 { font-size: 20px; margin: 0 0 8px; }
  .empty p { font-size: 14px; color: var(--muted); max-width: 420px; line-height: 1.5; margin: 0 0 20px; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 460px; }
  #chips button { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--text); cursor: pointer; }
  .row { display: flex; margin-bottom: 14px; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 80%; border-radius: 12px; padding: 12px 15px; font-size: 14.5px;
    line-height: 1.5; white-space: pre-wrap; }
  .row.user .bubble { background: var(--panel2); border: 1px solid var(--border); }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); }
  #inputRow { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
  #inputWrap { max-width: 720px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  #msgInput { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14.5px; color: var(--text); outline: none; }
  #sendBtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--text); }
  #sendBtn.active { background: var(--accent); border-color: var(--accent); }
  .loading { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); width: fit-content; }
</style>
</head>

  or roasts 3-5 days refrigerated; eggs 3-5 weeks; fresh leafy greens
  3-7 days; frozen vegetables 8+ months; canned goods 1-2+ years (check for
  damage/bulging, not just date). These are ballparks for advice, not a
  substitute for a food safety recall check or the item's actual label.
- "When in doubt, throw it out" is the standard food-safety heuristic —
  reinforce this rather than encouraging someone to push a questionable
  item past its safe window to save money; food safety risk isn't worth
  the savings.

VEHICLE MAINTENANCE
- Typical intervals (manufacturer schedules vary, these are common
  ballparks): oil change every ~5,000-7,500 mi or 6 months (shorter for
  older/conventional oil, longer for full synthetic — check the specific
  vehicle); tire rotation every ~5,000-6,000 mi (often paired with oil
  changes); tire pressure worth checking monthly since it fluctuates with
  temperature; engine air filter ~12,000-15,000 mi or annually; brake
  inspection ~12,000 mi; battery ~3-5 years but worth checking annually
  once past year 3.
- Whichever comes first (date OR mileage) is the correct trigger for
  service — a low-mileage driver still needs date-based service (fluids/
  rubber degrade with time, not just use), and a high-mileage driver hits
  mileage triggers faster than the date-based ones.

TRAVEL / PACKING
- Forgetting things while packing is usually a "wasn't visible/written
  down" problem, not a memory problem — the fix is a written list checked
  the day of, not "try to remember better." This app's three-phase split
  (prep tasks with lead time / packing list / departure-day final checks)
  mirrors how packing actually fails: forgetting to DO something in
  advance (haircut, refill a prescription) is a different failure mode
  than forgetting to PACK something, which is different again from
  forgetting something in the final rush out the door — treat each phase
  with its own logic when advising, don't collapse them into one generic
  "packing list."`;

  const QUICK_CHIPS = [
    "I'm overwhelmed, where do I start?",
    "Help me break this into smaller steps",
    "Explain this a different way",
    "What's a good ADHD-friendly system for this?",
  ];

  const bodyEl = document.getElementById("chatBody");
  const inputEl = document.getElementById("msgInput");
  const sendEl = document.getElementById("sendBtn");
  const statusEl = document.getElementById("statusText");
  const chipsEl = document.getElementById("chips");

  QUICK_CHIPS.forEach((chip) => {
    const b = document.createElement("button");
    b.textContent = chip;
    b.onclick = () => sendMessage(chip);
    chipsEl.appendChild(b);
  });

  let messages = [];
  let loading = false;

  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  sendEl.onclick = () => sendMessage();
  inputEl.addEventListener("input", () => sendEl.classList.toggle("active", inputEl.value.trim().length > 0));

  function setLoading(v) {
    loading = v;
    statusEl.textContent = v ? "● THINKING" : "○ STANDBY";
    statusEl.style.color = v ? "var(--accent)" : "var(--muted)";
  }

  function render(role, text) {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "assistant");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    bodyEl.appendChild(row);
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  async function sendMessage(preset) {
    const content = (preset !== undefined ? preset : inputEl.value).trim();
    if (!content || loading) return;
    inputEl.value = "";
    sendEl.classList.remove("active");
    render("user", content);
    messages.push({ role: "user", content });
    setLoading(true);

    const loadingRow = document.createElement("div");
    loadingRow.className = "row assistant";
    loadingRow.innerHTML = `<div class="loading">thinking it through...</div>`;
    bodyEl.appendChild(loadingRow);
    bodyEl.scrollTop = bodyEl.scrollHeight;

    try {
      if (PROXY_URL.includes("PASTE_YOUR")) throw new Error("PROXY_URL not configured yet");
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          max_tokens: 1000,
          system: `${IDENTITY}\n\nGENERAL KNOWLEDGE BASE:\n${KNOWLEDGE_BASE}\n\nYou don't have live personal data about this specific person unless they tell you in the conversation — don't invent specifics.`,
          messages: messages,
        }),
      });
      const data = await res.json();
      loadingRow.remove();
      const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n") || "No response received.";
      render("assistant", text);
      messages.push({ role: "assistant", content: text });
    } catch (e) {
      loadingRow.remove();
      render("assistant", "Couldn't reach Blue Bonnet right now. Check back in a bit.");
      console.error("Blue Bonnet error:", e);
    } finally {
      setLoading(false);
    }
  }
})();
</script>
